apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reporter-ingress
  namespace: reporter
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - oun.me
      secretName: reporter-tls
  rules:
    - host: oun.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: reporter-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reporter-ui
                port:
                  number: 80