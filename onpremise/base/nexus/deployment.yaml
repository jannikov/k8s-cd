apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: ci
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      containers:
      - name: nexus
        image: sonatype/nexus3:3.97.3@sha256:4b9a0efb605808c15927c751107b3f3308ae306c4b22715c96bf9bbabbb0e736
        env:
        - name: NEXUS_SECRETS_KEY_FILE
          value: /etc/nexus-encryption/secrets.json
        ports:
        - containerPort: 8081
        startupProbe:
          httpGet:
            path: /service/rest/v1/status
            port: 8081
          periodSeconds: 10
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /service/rest/v1/status
            port: 8081
          periodSeconds: 10
        volumeMounts:
        - mountPath: /nexus-data
          name: nexus-data
        - name: encryption-key
          mountPath: /etc/nexus-encryption
          readOnly: true
      volumes:
      - name: encryption-key
        secret:
          secretName: nexus-encryption
      - name: nexus-data
        persistentVolumeClaim:
          claimName: nexus-pvc
  revisionHistoryLimit: 2
