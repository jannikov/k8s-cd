apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-selfsigned
  namespace: cd
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-tls
  namespace: cd
spec:
  secretName: argocd-server-tls
  subject:
    organizations:
    - Moonlight Home
  dnsNames:
  - argocd.moonlight.local
  - localhost
  - argocd-server
  - argocd-server.cd
  - argocd-server.cd.svc
  - argocd-server.cd.svc.cluster.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: argocd-selfsigned
    kind: Issuer
