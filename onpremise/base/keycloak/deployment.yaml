apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.8.1
        args: [start]
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          value: postgres.db.svc.cluster.local
        - name: KC_DB_URL_DATABASE
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: database
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: username
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: password
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: juri
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: admin-password
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HOSTNAME
          value: http://192.168.88.237:30081
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_CACHE
          value: local
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
          periodSeconds: 10
          failureThreshold: 6
