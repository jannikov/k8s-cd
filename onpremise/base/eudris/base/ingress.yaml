apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eudris-ingress
  namespace: eudris
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - eudris.duckdns.org
      secretName: eudris-tls
  rules:
    - host: eudris.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eudris-app
                port:
                  number: 80