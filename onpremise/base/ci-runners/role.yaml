apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-job-admin
  namespace: ci
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
