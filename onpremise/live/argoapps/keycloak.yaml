apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: cd
spec:
  project: default
  source:
    repoURL: https://github.com/jannikov/k8s-cd.git
    targetRevision: main
    path: onpremise/live/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
