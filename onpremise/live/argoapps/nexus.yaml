apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus
  namespace: cd
  annotations:
    link.argocd.argoproj.io/external-link: https://nexus.moonlight.local:31443/
spec:
  project: default
  source:
    repoURL: https://github.com/jannikov/k8s-cd.git
    targetRevision: main
    path: onpremise/live/nexus
  destination:
    server: https://kubernetes.default.svc
    namespace: ci
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
